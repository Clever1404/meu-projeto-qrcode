<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - QRPix PRO</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 350px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #4b5563; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background-color: #16a34a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .alert-container { text-align: center; margin-bottom: 15px; font-size: 14px; border-radius: 6px; }
        .link { display: block; text-align: center; margin-top: 15px; color: #4f46e5; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align:center; margin-top:0; color: #111827;">Criar Conta</h2>
        
        <div id="mensagem-alerta"><!-- ALERTA_PLACEHOLDER --></div>

        <form action="/cadastro" method="POST">
            <div class="form-group"><label>Nome Completo:</label><input type="text" name="nome" required></div>
            <div class="form-group"><label>E-mail:</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Senha:</label><input type="password" name="senha" required></div>
            <button type="submit" class="btn">Cadastrar</button>
        </form>
        <a href="/login" class="link">Já tem conta? Entrar</a>
    </div>
</body>
</html>
