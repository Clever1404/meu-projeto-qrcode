<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRPix PRO - Geração de QR Code Automático</title>
    <style>
        body { font-family: sans-serif; background-color: #f9fafb; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 850px; width: 100%; display: grid; grid-template-columns: 1fr; gap: 30px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin: 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 1.2fr 0.8fr; } }
        .brand { font-size: 24px; font-weight: 900; color: #111827; margin-bottom: 15px; }
        .brand span { color: #4f46e5; }
        h1 { font-size: 32px; font-weight: 800; color: #111827; margin: 0 0 15px 0; }
        p { font-size: 15px; color: #6b7280; margin: 0 0 20px 0; line-height: 1.5; }
        .badge { display: inline-block; font-size: 12px; font-weight: bold; color: #16a34a; background-color: #f0fdf4; padding: 6px 14px; border-radius: 99px; margin-bottom: 25px; }
        .actions { display: flex; gap: 10px; }
        .btn { text-decoration: none; font-weight: bold; font-size: 14px; padding: 12px 24px; border-radius: 10px; text-align: center; }
        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-secondary { background-color: #e0e7ff; color: #4f46e5; }
        .visual-right { display: flex; justify-content: center; align-items: center; background-color: #f3f4f6; border-radius: 14px; padding: 20px; }
        .visual-right img { width: 160px; height: 160px; background: white; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="brand">QRPix <span>PRO</span></div>
            <h1>Geração de QR Code Automático</h1>
            <p>Cadastre-se e gere até 2 QR Codes gratuitos de forma instantânea e homologada no padrão do Banco do Brasil.</p>
            <div class="badge">🛡️ Ambiente seguro protegido com senhas</div>
            <div class="actions">
                <a href="/login" class="btn btn-primary">Fazer Login</a>
                <a href="/cadastro" class="btn btn-secondary">Criar Conta</a>
            </div>
        </div>
        <div class="visual-right">
            <div class="qr-placeholder">
                <img src="https://qrserver.com" alt="QR Code">
            </div>
        </div>
    </div>
</body>
</html>
